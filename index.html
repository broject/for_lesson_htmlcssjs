<html>

<head>
    <!-- дараагийн хичээл дээр fontawesome зааж өгнө -->
    <style>
        body {
            background-color: rgb(16, 41, 80);
            /* #201654; */
            font-family: "Rubik", sans-serif;
            padding: 0px;
            margin: 0px;
        }

        h1 {
            color: orange;
        }

        .my-topbar {
            background-color: #1c3459;
            padding: 15px 25px;
        }

        .my-topbar ul {
            list-style: none;
            display: block;
            margin: 0;
            padding: 0;
        }

        .my-topbar ul li {
            display: inline-block;
            color: white;
            padding: 10px;
        }

        .my-topbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .my-topbar ul li a:hover {
            color: #097bed;
        }

        .my-logo {
            padding: 15px 35px;
        }

        .my-logo .logo {
            float: left;
            width: 50%;
            color: white;
            text-transform: uppercase;
            font-size: 36px;
            font-weight: bold;
        }

        .my-logo .logo span:first-child {
            color: orange;
        }

        .my-logo img {
            width: 50%;
            height: auto;
        }

        .my-header {
            background-color: #097bed;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            padding: 15px 35px;
            display: flex;
            align-items: center;
            align-content: space-between;
        }

        .my-header ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: block;
        }

        .my-header ul li:first-child {
            border-left: none;
        }

        .my-header ul li {
            display: inline-block;
            padding: 15px;
            font-size: 15px;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 500;
        }

        .my-header .menu-search-box {
            background-color: #086ed5;
            position: relative;
        }

        .my-header .menu-search-box input {
            background-color: transparent;
            padding: 15px;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="my-topbar">
        <nav>
            <ul>
                <!-- href - hyper references -->
                <li><a href="#">Author</a></li>
                <li><a href="#">Advertisment</a></li>
                <li><a href="#">Member</a></li>
                <li><a href="#">Sitemap</a></li>
            </ul>
        </nav>
    </div>
    <br />
    <div class="my-logo">
        <div class="logo"><span>Next</span><span>Page</span></div>
        <img src="/images/top_banner.png" />
    </div>
    <br />
    <div class="my-header">
        <nav>
            <ul>
                <li>Нүүр</li>
                <li>Тухай</li>
                <li>Мэдээлэл</li>
                <li>Бүтээлүүд</li>
                <li>Холбогдох</li>
            </ul>
        </nav>
        <div class="menu-search-box">
            <input type="text" placeholder="Search For">
            <button type="submit" class="submit-btn"><i class="fa fa-search"></i></button>
        </div>
    </div>
</body>

</html>
